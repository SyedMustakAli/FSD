<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">MNC Institute</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                 <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="registration.html">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">

    <h2 class="text-center mb-4">Course Registration Form</h2>

    <!-- Success Alert -->
    <div class="alert alert-success">
        Registration Successful!
    </div>

    <div class="card shadow p-4">

        <form>

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label><br>

                <input type="radio" name="gender"> Male
                <input type="radio" name="gender" class="ms-3"> Female
                <input type="radio" name="gender" class="ms-3"> Other
            </div>

            <div class="mb-3">
                <label class="form-label">Course Selection</label>

                <select class="form-select">
                    <option>Web Development</option>
                    <option>Python Programming</option>
                    <option>Data Science</option>
                    <option>AI & Machine Learning</option>
                    <option>Java Programming</option>
                    <option>Cloud Computing</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Qualification</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload Resume</label>
                <input type="file" class="form-control">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">
                    I agree to the Terms & Conditions
                </label>
            </div>

            <button type="submit" class="btn btn-success">
                Register
            </button>

            <button type="reset" class="btn btn-secondary">
                Reset
            </button>

        </form>

    </div>

</div>

</body>
</html>
