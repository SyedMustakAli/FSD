<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-info ">
            <div class="container">
                <img src="photos/cvr logo.png" alt="cvrlogo" width="100" height="100" class="rounded-5  ">

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown">
                                Courses
                            </a>

                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">CSE</a></li>
                                <li><a class="dropdown-item" href="#">CSD</a></li>
                                <li><a class="dropdown-item" href="#">CSC</a></li>
                                <li><a class="dropdown-item" href="#">AIML</a></li>
                                <li><a class="dropdown-item" href="#">CIVIL</a></li>
                            </ul>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>

                        <li class="nav-item ms-2">
                            <a href="#" class="btn btn-dark text-white">
                                Login
                            </a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <section class="registration">
    <div class="container">
        <div class="card shadow-lg mt-3"> 
            <div class="card-header bg-primary text-white text-center">
                <h3 class="lead fw-bold">Student Registration Form</h3>
            </div>

            <div class="card-body text-black" style="background: linear-gradient(to right , rgb(20, 202, 226), white);">

                <form class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" required>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">Roll Number</label>
                        <input type="text" class="form-control" required>
                    </div>

 
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel"class="form-control"pattern="[0-9]{10}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Gender</label>

                        <select class="form-select" required>
                            <option value="">Choose...</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Branch</label>

                        <select class="form-select" required>
                            <option value="">Choose Branch</option>
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>Mechanical</option>
                            <option>Civil</option>
                        </select>

                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" required>

                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Upload Photo</label>
                        <input type="file"
                            class="form-control"
                            accept="image/*"
                            required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Address</label>

                        <textarea class="form-control"
                                rows="4"
                                required></textarea>
                    </div>


                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input"
                                type="checkbox"
                                required>

                            <label class="form-check-label">
                                I agree to the Terms and Conditions
                            </label>
                        </div>
                    </div>


                    <div class="col-12 text-center">
                        <button class="btn btn-primary px-4"
                                type="submit">
                            Register
                        </button>

                        <button class="btn btn-secondary px-4"
                                type="reset">
                            Reset
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
    </section>
    
</body>
</html>
