<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <section class="feature">
        <div class="container">
            <div>
                <h3 class="lead text-center display-3 fw-bold my-3">
                    Student Dashboard
                </h3>
            </div>
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <div class="card h-100 ">
                        <div class="card-body">
                            <img src="photos/total students.png" alt="student registration" class="card-img-top"  width="200" height="300">
                            <div class="card-title">
                                <h5 class="text-center">Total Students</h5>
                            </div>
                            <div class="card-text">
                                <p class="text-center text-success fw-bold">1020</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <div class="card h-100 ">
                        <div class="card-body">
                            <img src="photos/present.jpg" alt="Attendence Management" class="card-img-top" width="200" height="300">
                            <div class="card-title">
                                <h5 class="text-center"> Present Students</h5>
                            </div>
                            <div class="card-text">
                                <p class="text-center text-success fw-bold">500</p>
                            </div>
                        </div>
                    </div>
                </div>
                
               
                 <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <div class="card h-100 ">
                        <div class="card-body">
                            <img src="photos/absent.webp" alt="Result Management" class="card-img-top"  width="200" height="300">
                            <div class="card-title">
                                <h5 class="text-center">Absent Students</h5>
                            </div>
                            <div class="card-text">
                                <p class="text-center text-success fw-bold">520</p>
                            </div>
                        </div>
                    </div>
                </div>
                 <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <div class="card h-100 ">
                        <div class="card-body">
                            <img src="photos/placements.png" alt="Result Management" class="card-img-top"  width="200" height="300">
                            <div class="card-title">
                                <h5 class="text-center" >Placements</h5>
                            </div>
                            <div class="card-text">
                                <p class="text-center text-success fw-bold">620</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <input type="text" class="form-control" placeholder="Search Student">
        </div>
    </div>
</div>

<div class="container mt-4">
    <h3 class="text-center mb-3">Student Details</h3>

    <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover">
           <thead class="table-dark">
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Attendance</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>101</td>
                    <td>Rahul</td>
                    <td>CSE</td>
                    <td><span class="badge bg-success">90%</span></td>
                    <td>
                        <a href="Student Profile1.html" class="btn btn-primary btn-sm">
                            View Profile
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Priya</td>
                    <td>ECE</td>
                    <td><span class="badge bg-primary">85%</span></td>
                    <td>
                        <a href="Student Profile2.html" class="btn btn-primary btn-sm">
                            View Profile
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Amit</td>
                    <td>MECH</td>
                    <td><span class="badge bg-warning text-dark">75%</span></td>
                    <td>
                        <a href="Student Profile3.html" class="btn btn-primary btn-sm">
                            View Profile
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>104</td>
                    <td>Neha</td>
                    <td>CIVIL</td>
                    <td><span class="badge bg-danger">60%</span></td>
                    <td>
                        <a href="Student Profile4.html" class="btn btn-primary btn-sm">
                            View Profile
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
